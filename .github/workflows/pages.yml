name: Deploy docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test "tests/*.test.js"
      - name: Build manifest
        run: python3 scripts/build_manifest.py
      # Comments / live edit: set the repository variable HTML_COMMENT_SERVER to turn it on; unset publishes as before
      - name: Inject comment SDK
        if: vars.HTML_COMMENT_SERVER != ''
        run: python3 scripts/inject_sdk.py "$HTML_COMMENT_SERVER"
        env:
          HTML_COMMENT_SERVER: ${{ vars.HTML_COMMENT_SERVER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
